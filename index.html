<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVZN Screening Room — Every InavizionMedia Build, One Room</title>
<meta name="description" content="Every InavizionMedia site in one room — live previews and repos.">
<meta property="og:title" content="IVZN Screening Room">
<meta property="og:description" content="Every InavizionMedia build, one room — live previews and repos.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://inavizionmedia.github.io/IVZN-Screening-Room/">
<meta property="og:image" content="https://inavizionmedia.github.io/IVZN-Screening-Room/assets/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://inavizionmedia.github.io/IVZN-Screening-Room/assets/screenshot.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23d52620'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial Black'>IV</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d52620; --red-dark:#a3120c; --ink:#141210; --muted:#6f6a63;
    --paper:#faf8f4; --mid:#f1ece2; --card:#ffffff; --line:#e9e2d8; --gold:#c9a227;
    --hero-grad:linear-gradient(180deg,#ffffff 0%,#faf8f4 100%);
    --btn-bg:#ffffff;
    --shadow:0 18px 40px -18px rgba(213,38,32,.25);
  }
  [data-theme="dark"]{
    --red:#e92720; --red-dark:#ff6b62; --ink:#f2ede4; --muted:#a39a8b;
    --paper:#100e0c; --mid:#171310; --card:#1b1815; --line:#2e2822; --gold:#c9a227;
    --hero-grad:linear-gradient(180deg,#1b1815 0%,#100e0c 100%);
    --btn-bg:#1b1815;
    --shadow:0 18px 44px -18px rgba(233,39,32,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Source Sans 3',system-ui,sans-serif; background:var(--mid); color:var(--ink); -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease}
  header.hero{position:relative; padding:64px 24px 40px; text-align:center; background:var(--hero-grad); border-bottom:1px solid var(--line)}
  .theme-toggle{position:absolute; top:18px; right:18px; width:38px; height:38px; background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:50%; cursor:pointer; transition:all .15s ease; padding:0; opacity:.5}
  @media (hover:hover){
    .theme-toggle:hover{color:var(--ink); border-color:var(--muted); opacity:1}
  }
  .theme-toggle:focus-visible{opacity:1; outline:none}
  .theme-toggle svg{position:absolute; top:50%; left:50%; width:18px; height:18px; transform:translate(-50%,-50%); display:block}
  .kicker{font-family:'Barlow Condensed'; font-weight:600; letter-spacing:.35em; text-transform:uppercase; font-size:13px; color:var(--red); margin-bottom:12px}
  h1{font-family:'Barlow Condensed'; font-weight:700; font-size:clamp(44px,7vw,76px); line-height:.95; letter-spacing:.01em; text-transform:uppercase}
  h1 .accent{color:var(--red)}
  .tagline{margin-top:14px; font-size:17px; color:var(--muted); max-width:620px; margin-left:auto; margin-right:auto}
  .org-link{display:inline-block; margin-top:18px; font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); text-decoration:none; border-bottom:2px solid var(--red); padding-bottom:2px}
  main{max-width:1180px; margin:0 auto; padding:44px 24px 80px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:26px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, background .2s ease, border-color .2s ease}
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
  .shot{position:relative; aspect-ratio:16/9; overflow:hidden; background:#111}
  .shot img{width:100%; height:100%; object-fit:cover; object-position:top; display:block}
  .body{padding:20px 22px 22px; display:flex; flex-direction:column; flex:1}
  .body h2{font-family:'Barlow Condensed'; font-weight:700; font-size:26px; text-transform:uppercase; letter-spacing:.02em; line-height:1}
  .body .desc{margin-top:6px; font-size:14.5px; color:var(--muted)}
  .meta{margin-top:12px; font-size:12.5px; color:var(--muted)}
  .meta b{color:var(--ink); font-weight:600}
  .actions{margin-top:16px; display:flex; gap:10px; margin-top:auto; padding-top:16px}
  .btn{flex:1; text-align:center; font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.1em; text-transform:uppercase; text-decoration:none; padding:11px 0; border-radius:9px; border:1.5px solid var(--ink); color:var(--ink); background:var(--btn-bg); transition:all .15s ease}
  .btn.primary{background:var(--red); border-color:var(--red); color:#fff}
  .btn.primary:hover{background:var(--red-dark); border-color:var(--red-dark)}
  .btn:hover:not(.primary){background:var(--ink); color:var(--paper)}
  footer{text-align:center; padding:36px 24px 60px; color:var(--muted); font-size:13px; border-top:1px solid var(--line); background:var(--paper)}
  footer a{color:var(--red-dark); text-decoration:none; font-weight:600}
  @media(max-width:420px){ .grid{grid-template-columns:1fr} header.hero{padding:48px 18px 32px} .theme-toggle{top:12px; right:12px; padding:6px 14px} }
</style>
</head>
<body>
<header class="hero">
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/></svg></button>
  <div class="kicker">InavizionMedia</div>
  <h1>IVZN <span class="accent">Screening</span> Room</h1>
  <p class="tagline">Every InavizionMedia build, one room. Screen the latest previews, hop into the repos — then send feedback.</p>
  <a class="org-link" href="https://github.com/InavizionMedia" target="_blank" rel="noopener">github.com/InavizionMedia</a>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>
  Built for <a href="https://github.com/InavizionMedia" target="_blank" rel="noopener">InavizionMedia</a> · Previews via GitHub Pages · <span id="stamp"></span>
</footer>
<script>
// theme: dark default, toggle remembers the choice
(function(){
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.2A8 8 0 1 1 10.8 4 6.4 6.4 0 0 0 20 13.2z"/></svg>';
  function label(){ btn.innerHTML = root.dataset.theme === 'dark' ? ICON_SUN : ICON_MOON; }
  try { var saved = localStorage.getItem('ivzn-theme'); if (saved) root.dataset.theme = saved; } catch(e){}
  label();
  btn.addEventListener('click', function(){
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('ivzn-theme', root.dataset.theme); } catch(e){}
    label();
  });
})();
const PROJECTS = [
  { repo:"InavizionMedia-Remake", name:"InavizionMedia", desc:"The flagship — InavizionMedia's own site.",
    preview:"https://inavizionmedia.github.io/InavizionMedia-Remake/",
    img:"https://inavizionmedia.github.io/InavizionMedia-Remake/assets/og-card.jpg" },
  { repo:"TheStartingBlocks-Remake", name:"The Starting Blocks", desc:"Done-for-you one-page websites.",
    preview:"https://inavizionmedia.github.io/TheStartingBlocks-Remake/",
    img:"https://inavizionmedia.github.io/TheStartingBlocks-Remake/assets/screenshot.png" },
  { repo:"MyStudioChannel-Remake", name:"My Studio Channel", desc:"Your content. Your channel. Your studio.",
    preview:"https://inavizionmedia.github.io/MyStudioChannel-Remake/",
    img:"https://inavizionmedia.github.io/MyStudioChannel-Remake/assets/screenshot.png" },
  { repo:"YolandoMitchellBrown-Remake", name:"Yolando Mitchell Brown", desc:"Virtual creative entrepreneur.",
    preview:"https://inavizionmedia.github.io/YolandoMitchellBrown-Remake/",
    img:"https://inavizionmedia.github.io/YolandoMitchellBrown-Remake/assets/og-image.jpg",
    fit:"contain", bg:"#fdf9f4" },
  { repo:"EveryWayWoman-Remake", name:"Every Way Woman", desc:"Real talk. Every way.",
    preview:"https://inavizionmedia.github.io/EveryWayWoman-Remake/",
    img:"https://inavizionmedia.github.io/EveryWayWoman-Remake/assets/og-image.jpg" },
  { repo:"TalkshowLand-Remake", name:"Talk Show Land", desc:"Daytime TV streaming platform.",
    preview:"https://inavizionmedia.github.io/TalkshowLand-Remake/",
    img:"https://inavizionmedia.github.io/TalkshowLand-Remake/assets/og-image.jpg?v=20261007d" },
];
const grid = document.getElementById('grid');
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
PROJECTS.forEach(p=>{
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML =
    '<div class="shot"'+(p.bg?' style="background:'+p.bg+'"':'')+'>' +
      '<img src="'+p.img+'" alt="'+p.name+' preview" loading="lazy"'+(p.fit?' style="object-fit:'+p.fit+'"':'')+'>' +
    '</div>' +
    '<div class="body"><h2>'+p.name+'</h2><p class="desc">'+p.desc+'</p>' +
    '<div class="meta"><span>Last push: <b class="js-push">…</b></span></div>' +
    '<div class="actions">' +
      '<a class="btn primary" href="'+p.preview+'" target="_blank" rel="noopener">Preview</a>' +
      '<a class="btn" href="https://github.com/InavizionMedia/'+p.repo+'" target="_blank" rel="noopener">Repo</a>' +
    '</div></div>';
  grid.appendChild(el);
  fetch('https://api.github.com/repos/InavizionMedia/'+p.repo).then(r=>r.json()).then(d=>{
    el.querySelector('.js-push').textContent = fmtDate(d.pushed_at);
  }).catch(()=>{ el.querySelector('.js-push').textContent = '—'; });
});
document.getElementById('stamp').textContent = 'Updated ' + new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
</script>
</body>
</html>
